# Render Blueprint: free web service. The data lives in a free Supabase
# PostgreSQL database (set DATABASE_URL when Render asks), so it survives
# restarts and sleeping.
services:
  - type: web
    # Also the free address: https://trophypilot.onrender.com. Renaming it makes Render create a new service.
    name: trophypilot
    runtime: node
    plan: free
    region: frankfurt
    # db push creates/updates the tables; it refuses changes that would delete data, which fails the build safely.
    buildCommand: npm ci --include=dev && npx prisma db push && npm run db:trophy-slugs && npm run demo:user && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Supabase session pooler (port 5432): postgresql://postgres.<project>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres
      # The app switches itself to the transaction pooler (6543); see src/lib/db.ts.
      - key: DATABASE_URL
        sync: false
      - key: PSN_NPSSO
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      # Twitch developer app for IGDB game details (optional).
      - key: IGDB_CLIENT_ID
        sync: false
      - key: IGDB_CLIENT_SECRET
        sync: false
      - key: SITE_OPERATOR_NAME
        sync: false
      # reCAPTCHA v2 site key for the contact form (the secret goes in Formspree).
      - key: CAPTCHA_SITE_KEY
        sync: false
      # Email verification (resend.com) and picture uploads (Supabase Storage). Optional: see .env.example.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_FORMSPREE_FORM_ID
        value: xljdozjl
