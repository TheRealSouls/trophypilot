# Render Blueprint: free web service. The data lives in a free Neon
# PostgreSQL database (set DATABASE_URL when Render asks), so it survives
# restarts and sleeping. See README, "Deploying for free (Render + Neon)".
services:
  - type: web
    # Also the free address: https://trophypilot.onrender.com. Renaming it makes Render create a new service.
    name: trophypilot
    runtime: node
    plan: free
    region: frankfurt
    # db push creates/updates the tables; it refuses changes that would delete data, which fails the build safely.
    buildCommand: npm ci --include=dev && npx prisma db push && npm run db:trophy-slugs && npm run demo:user && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Neon connection string (direct, not pooled): postgresql://...neon.tech/neondb?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: PSN_NPSSO
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      # Twitch developer app for IGDB game details (optional).
      - key: IGDB_CLIENT_ID
        sync: false
      - key: IGDB_CLIENT_SECRET
        sync: false
      - key: SITE_OPERATOR_NAME
        sync: false
      - key: SITE_CONTACT_EMAIL
        sync: false
      # reCAPTCHA v2 site key for the contact form (the secret goes in Formspree).
      - key: CAPTCHA_SITE_KEY
        sync: false
      - key: NEXT_PUBLIC_FORMSPREE_FORM_ID
        value: xljdozjl
